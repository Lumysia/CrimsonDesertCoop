name: build

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows (Steam ${{ matrix.steam }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        steam: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v5
      - name: Fetch Steamworks SDK
        if: matrix.steam == 'ON'
        shell: pwsh
        run: |
          git init steamworks
          git -C steamworks remote add origin https://github.com/rlabrecque/SteamworksSDK.git
          git -C steamworks sparse-checkout init --cone
          git -C steamworks sparse-checkout set public redistributable_bin/win64
          git -C steamworks fetch --depth 1 origin df2baabf574a738ef1ea90a7e89339107fc0a279
          git -C steamworks checkout --detach FETCH_HEAD
      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DCDCOOP_USE_STEAM=${{ matrix.steam }}
          -DCDCOOP_BUILD_TESTS=ON
          -DSTEAMWORKS_SDK_PATH="${{ github.workspace }}/steamworks"
      - name: Build
        shell: pwsh
        run: |
          $output = & cmake --build build --config Release 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { "$_" }
          if ($exitCode -ne 0) {
            $errors = @($output | Where-Object {
              "$_" -match '(?i)(fatal error|error [A-Z]+[0-9]+|error:|FAILED:)'
            })
            foreach ($line in $errors) {
              $message = "$line" -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              "::error::$message"
            }
            exit $exitCode
          }
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
